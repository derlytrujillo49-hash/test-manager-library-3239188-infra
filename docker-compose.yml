version: '3.8'

services:
  # Motor de base de datos de referencia (PostgreSQL 16)
  database:
    image: postgres:16-alpine
    container_name: test-manager-library-db
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: sena_operator
      POSTGRES_PASSWORD: secure_sdd_password
      TZ: UTC  # Obligatorio por especificación: Servidor operando en UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
